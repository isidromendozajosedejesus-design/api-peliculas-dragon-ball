services:
  postgres:
    image: postgres:17-alpine
    container_name: api-maestros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_maestros
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_maestros"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
